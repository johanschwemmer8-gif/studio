
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNteract AOE In-Store Display</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #content-container {
            width: 100%;
            height: 100%;
        }
        #content-container img, #content-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ai-prompt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        .ai-prompt-text {
            font-size: 2.5vw;
            font-style: italic;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .product-card {
            background-color: #1a1a1a;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 0.25rem;
        }
        .product-card .name {
            font-weight: bold;
            margin-top: 0.5rem;
        }
        .product-card .price {
            color: #29ABE2;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div id="content-container">
        <p>Initializing Display...</p>
    </div>

    <script>
        const firebaseConfig = {
            "projectId": "interact-aoe-kidkn",
            "appId": "1:783333671853:web:53f7f226c95ac08fbd5724",
            "storageBucket": "interact-aoe-kidkn.firebasestorage.app",
            "apiKey": "AIzaSyAuB__O0Bo4uQLeyZ3UH2wYpbEbcuGevFI",
            "authDomain": "interact-aoe-kidkn.firebaseapp.com",
            "measurementId": "",
            "messagingSenderId": "783333671853"
        };
        
        let db;
        let displayId;

        function initialize() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();

                const urlParams = new URLSearchParams(window.location.search);
                displayId = urlParams.get('displayId');

                if (!displayId) {
                    renderError('No displayId provided in URL. Please add ?displayId=your_id');
                    return;
                }

                document.title = `Display - ${displayId}`;

                listenForDisplayDoc();
                listenForCommands();
                setInterval(ping, 5 * 60 * 1000); // Ping every 5 minutes
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                renderError('Could not connect to Firebase. Check console for details.');
            }
        }
        
        function listenForDisplayDoc() {
            const displayRef = db.collection('displays').doc(displayId);
            
            displayRef.onSnapshot(doc => {
                if (!doc.exists) {
                    renderError(`Display with ID ${displayId} is not registered.`);
                    return;
                }
                const displayData = doc.data();
                if (displayData.contentConfigId) {
                    listenForContentConfig(displayData.contentConfigId, displayData.retailerId);
                } else {
                    renderContent({ type: 'static_text', text: 'Display is idle. Assign content from the dashboard.' });
                }
            }, error => {
                console.error("Error listening to display document:", error);
                renderError('Error connecting to display data.');
            });
        }

        let unsubscribeContent;
        function listenForContentConfig(configId, retailerId) {
             if (unsubscribeContent) {
                unsubscribeContent();
            }

            const configRef = db.collection('inStoreConfigs').where('configId', '==', configId).limit(1);
            
            unsubscribeContent = configRef.onSnapshot(snapshot => {
                if (snapshot.empty) {
                    renderError(`Content configuration with ID ${configId} not found.`);
                    return;
                }
                const configDoc = snapshot.docs[0];
                const configData = configDoc.data();
                renderContent(configData.contentSlot, retailerId);
            }, error => {
                console.error("Error listening to content config:", error);
                renderError('Error loading content configuration.');
            });
        }
        
        let unsubscribeProducts;
        function renderContent(content, retailerId) {
            if (unsubscribeProducts) {
                unsubscribeProducts();
            }

            const container = document.getElementById('content-container');
            container.innerHTML = '';
            
            switch (content.type) {
                case 'static_image':
                    container.innerHTML = `<img src="${content.imageUrl}" alt="Display Content">`;
                    break;
                case 'dynamic_ai_prompt':
                    container.innerHTML = `<div class="ai-prompt-container"><p class="ai-prompt-text">${content.promptText}</p></div>`;
                    break;
                case 'promotional_video':
                    container.innerHTML = `<video src="${content.videoUrl}" autoplay muted loop playsinline></video>`;
                    break;
                case 'dynamic_content':
                     renderDynamicContent(container, content.dynamicType, retailerId);
                     break;
                case 'static_text':
                default:
                    container.innerHTML = `<p>${content.text || 'No content assigned.'}</p>`;
                    break;
            }
        }
        
        function renderDynamicContent(container, dynamicType, retailerId) {
            let query = db.collection('products').where('retailerId', '==', retailerId);

            if (dynamicType === 'top_selling_products') {
                query = query.orderBy('salesCount', 'desc').limit(10);
            } else if (dynamicType === 'low_inventory_items') {
                query = query.orderBy('stock', 'asc').limit(10);
            } else {
                renderError('Unknown dynamic content type.');
                return;
            }

            unsubscribeProducts = query.onSnapshot(snapshot => {
                if (snapshot.empty) {
                    container.innerHTML = `<p>No products to display for this category.</p>`;
                    return;
                }
                
                const grid = document.createElement('div');
                grid.className = 'product-grid';

                snapshot.forEach(doc => {
                    const product = doc.data();
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.imageUrl}" alt="${product.name}">
                        <div class="name">${product.name}</div>
                        <div class="price">R${product.price.toFixed(2)}</div>
                    `;
                    grid.appendChild(card);
                });
                container.innerHTML = '';
                container.appendChild(grid);

            }, error => {
                console.error("Error fetching dynamic products:", error);
                renderError("Could not load dynamic product list.");
            });
        }


        function listenForCommands() {
             const commandsRef = db.collection('displays').doc(displayId).collection('remoteCommands');
             commandsRef.where('status', '==', 'PENDING').orderBy('issuedAt', 'desc').limit(1).onSnapshot(snapshot => {
                if (snapshot.empty) return;

                snapshot.forEach(async doc => {
                    const commandData = doc.data();
                    console.log('Received command:', commandData.command);

                    try {
                        // Mark as acknowledged to prevent re-execution
                        await doc.ref.update({ status: 'ACKNOWLEDGED' });

                        switch (commandData.command) {
                            case 'RESTART':
                            case 'REFRESH_CONTENT':
                                location.reload();
                                break;
                            // Add other command handlers here
                        }
                        
                        // Clean up after execution
                        await doc.ref.update({ status: 'COMPLETED' });
                        await doc.ref.delete();

                    } catch (error) {
                        console.error("Failed to process command:", error);
                        await doc.ref.update({ status: 'FAILED' });
                    }
                });
            }, error => {
                console.error("Error listening for commands:", error);
            });
        }

        function ping() {
            if (!db || !displayId) return;
            const displayRef = db.collection('displays').doc(displayId);
            displayRef.update({ lastPing: new Date() }).catch(error => {
                console.error("Ping failed:", error);
            });
        }

        function renderError(message) {
            const container = document.getElementById('content-container');
            container.innerHTML = `<p style="color: red;">${message}</p>`;
        }

        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
