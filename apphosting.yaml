# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # Canonical public origin used when issuing production QR tracking URLs.
  - variable: QR_RESOLVER_BASE_URL
    value: "https://studio-1--interact-aoe-kidkn.us-east4.hosted.app"
    availability:
      - RUNTIME

  # Trusted Firebase Storage bucket for retailer QR presentation assets.
  - variable: QR_TEMPLATE_STORAGE_BUCKET
    value: "interact-aoe-kidkn.firebasestorage.app"
    availability:
      - RUNTIME

  # App Hosting's buildpack runs npm ci directly. Explicitly preserve
  # the project's legacy peer-dependency resolution policy.
  - variable: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
    availability:
      - BUILD

scripts:
  # Explicitly define the install command to handle legacy peer dependencies
  installCommand: npm install --legacy-peer-deps
  # Explicitly define the build command for the application
  buildCommand: rm -rf .next && npm run build
